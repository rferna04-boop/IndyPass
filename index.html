<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Indy Ski Consultant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header & Pass Progress Bar -->
        <header class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
                        🎿 Indy Pass 2026
                        <span class="text-xs px-2.5 py-1 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">Unionville Base</span>
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Season Consultant & Mountain Directory</p>
                </div>
                
                <!-- Season Burn-Down Counter -->
                <div class="flex items-center gap-4 bg-slate-950/60 border border-slate-800/80 px-4 py-3 rounded-xl">
                    <div class="text-right">
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Pass Days Used</div>
                        <div class="text-2xl font-black text-blue-400"><span id="stat-used">0</span> <span class="text-xs text-slate-500 font-normal">/ 36 potential</span></div>
                    </div>
                </div>
            </div>

            <!-- Visual Progress Bar -->
            <div class="mt-4 pt-4 border-t border-slate-800/60">
                <div class="flex justify-between text-xs text-slate-400 mb-1.5">
                    <span>Season Utilization</span>
                    <span id="stat-pct">0%</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                    <div id="stat-progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
        </header>

        <!-- Controls: Search, Filter, Sort -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3">
            <!-- Filter Pills -->
            <div class="flex flex-wrap gap-2 text-xs font-semibold">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3.5 py-2 rounded-xl bg-blue-600 text-white transition">All Mountains</button>
                <button onclick="setFilter('daytrip')" id="filter-daytrip" class="filter-btn px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition">⚡ Quick Hits (&lt; 2 hrs)</button>
                <button onclick="setFilter('weekender')" id="filter-weekender" class="filter-btn px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition">🏔️ Weekenders (3+ hrs)</button>
                <button onclick="setFilter('available')" id="filter-available" class="filter-btn px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition">Tickets Left</button>
            </div>

            <!-- Sorting Buttons -->
            <div class="flex gap-2">
                <button onclick="setSort('Drive Time')" id="sort-drive" class="flex-1 md:flex-none px-3.5 py-2 text-xs font-medium rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800 transition flex items-center justify-center gap-1.5">
                    <span>🚗 Sort: Drive</span>
                </button>
                <button onclick="setSort('Vertical Drop')" id="sort-vert" class="flex-1 md:flex-none px-3.5 py-2 text-xs font-medium rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800 transition flex items-center justify-center gap-1.5">
                    <span>↓ Sort: Vert</span>
                </button>
            </div>
        </div>

        <!-- Mountain Cards Container -->
        <div id="loading" class="text-center py-16 text-slate-400 animate-pulse">Syncing Indy Pass directory...</div>
        <div id="resort-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzGsR7rsHCVbj16HS9Qi2OgK583MhXyRozzOBaZ24Bf0ujdo-xo_3ZdfMOpn5GRqELz3g/exec';
        const BASE_ADDRESS = '538 Plainville Ave, Unionville, CT';

        let rawResorts = [];
        let activeFilter = 'all';
        let activeSort = 'Drive Time';

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                rawResorts = data.resorts.filter(r => r.Resort && r.Resort.trim() !== '');
                document.getElementById('loading').classList.add('hidden');
                updateDashboard();
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = '<span class="text-red-400">Failed to load data. Ensure Google Sheet is accessible.</span>';
            }
        }

        function updateDashboard() {
            // Stats
            const totalUsed = rawResorts.reduce((sum, r) => sum + (parseInt(r['Days Used']) || 0), 0);
            document.getElementById('stat-used').innerText = totalUsed;
            const pct = Math.min(100, Math.round((totalUsed / 36) * 100));
            document.getElementById('stat-pct').innerText = `${pct}%`;
            document.getElementById('stat-progress-bar').style.width = `${pct}%`;

            // Filter
            let list = rawResorts.filter(r => {
                const drive = parseFloat(r['Drive Time']) || 0;
                const days = parseInt(r['Days Used']) || 0;
                if (activeFilter === 'daytrip') return drive <= 2.0;
                if (activeFilter === 'weekender') return drive >= 3.0;
                if (activeFilter === 'available') return days < 2;
                return true;
            });

            // Sort
            list.sort((a, b) => {
                const valA = parseFloat(String(a[activeSort]).replace(/[^0-9.]/g, '')) || 0;
                const valB = parseFloat(String(b[activeSort]).replace(/[^0-9.]/g, '')) || 0;
                return activeSort === 'Vertical Drop' ? valB - valA : valA - valB;
            });

            // Deprioritize burned-out resorts
            list.sort((a, b) => {
                const maxA = (parseInt(a['Days Used']) >= 2) ? 1 : 0;
                const maxB = (parseInt(b['Days Used']) >= 2) ? 1 : 0;
                return maxA - maxB;
            });

            renderGrid(list);
        }

        function renderGrid(resorts) {
            const grid = document.getElementById('resort-grid');
            grid.innerHTML = '';

            if (resorts.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">No mountains match the current filter.</div>';
                return;
            }

            resorts.forEach(r => {
                const daysUsed = parseInt(r['Days Used']) || 0;
                const isMaxed = daysUsed >= 2;
                const navUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(BASE_ADDRESS)}&destination=${encodeURIComponent(r.Resort + ' Ski Resort, ' + r.State)}`;
                const trailMapUrl = `https://www.google.com/search?q=${encodeURIComponent(r.Resort + ' ' + r.State + ' ski trail map')}&btnI=1`;

                const card = document.createElement('div');
                card.className = `group bg-slate-900 border rounded-2xl p-5 flex flex-col justify-between transition-all duration-200 ${isMaxed ? 'border-red-950/40 bg-slate-950/40 opacity-50' : 'border-slate-800 hover:border-slate-700 hover:shadow-lg'}`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-lg text-white group-hover:text-blue-400 transition-colors">${r.Resort}</h3>
                                    <span class="text-xs px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 font-mono font-semibold">${r.State}</span>
                                </div>
                                <div class="flex items-center gap-3 mt-2 text-xs font-medium text-slate-400">
                                    <span class="flex items-center gap-1">↓ <strong class="text-slate-200">${Number(r['Vertical Drop']).toLocaleString()}</strong> ft</span>
                                    <span>&bull;</span>
                                    <span class="flex items-center gap-1">🚗 <strong class="text-slate-200">${r['Drive Time']}</strong> hrs</span>
                                </div>
                            </div>

                            <!-- Pass Indicator Badge -->
                            <div class="flex flex-col items-end">
                                <span class="text-[10px] tracking-wider uppercase text-slate-500 font-semibold mb-1">Indy Days</span>
                                <div class="flex gap-1.5 p-1 bg-slate-950 rounded-lg border border-slate-800">
                                    <div class="w-3.5 h-3.5 rounded-md ${daysUsed >= 1 ? 'bg-blue-500 shadow-sm shadow-blue-500/50' : 'bg-slate-800'}"></div>
                                    <div class="w-3.5 h-3.5 rounded-md ${daysUsed >= 2 ? 'bg-blue-500 shadow-sm shadow-blue-500/50' : 'bg-slate-800'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Bar -->
                    <div class="mt-5 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs">
                        <a href="${navUrl}" target="_blank" rel="noopener" class="text-blue-400 hover:text-blue-300 font-semibold flex items-center gap-1 transition">
                            Directions ↗
                        </a>
                        <a href="${trailMapUrl}" target="_blank" rel="noopener" class="text-slate-400 hover:text-slate-200 transition">
                            Trail Map ↗
                        </a>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function setFilter(type) {
            activeFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition';
            });
            const activeBtn = document.getElementById(`filter-${type}`);
            if (activeBtn) {
                activeBtn.className = 'filter-btn px-3.5 py-2 rounded-xl bg-blue-600 text-white font-semibold shadow-md shadow-blue-600/30 transition';
            }
            updateDashboard();
        }

        function setSort(type) {
            activeSort = type;
            updateDashboard();
        }

        init();
    </script>
</body>
</html>
