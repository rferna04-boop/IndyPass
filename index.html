<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Indy Ski Consultant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a native app feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header & Stats -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-700 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">2026 Indy Ski Platform</h1>
                <p class="text-slate-400 mt-1">Unionville Basecamp &bull; Live Tracker</p>
            </div>
            <div class="flex gap-6 text-sm">
                <div class="flex flex-col text-right">
                    <span class="text-slate-400">Season Vert</span>
                    <span id="total-vert" class="text-2xl font-semibold text-blue-400">0 ft</span>
                </div>
                <div class="flex flex-col text-right">
                    <span class="text-slate-400">Days Skied</span>
                    <span id="total-days" class="text-2xl font-semibold text-blue-400">0</span>
                </div>
            </div>
        </header>

        <!-- Loading State -->
        <div id="loading" class="animate-pulse flex space-x-4 py-12 justify-center">
            <div class="text-slate-400 font-medium">Syncing mountain data...</div>
        </div>

        <!-- Dashboard Content (Hidden until loaded) -->
        <div id="dashboard" class="hidden space-y-8">
            
            <!-- Resort Sorter -->
            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-white">Indy Pass Targets</h2>
                    <div class="flex gap-2">
                        <button onclick="sortResorts('Vertical Drop')" class="px-3 py-1 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded transition">Sort by Vert</button>
                        <button onclick="sortResorts('Drive Time')" class="px-3 py-1 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded transition">Sort by Drive</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="resort-grid">
                    <!-- Resort Cards Injected Here -->
                </div>
            </section>

            <!-- Slopes Log -->
            <section>
                <h2 class="text-xl font-semibold text-white mb-4">Slopes Sync Log</h2>
                <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-400 uppercase bg-slate-900/50">
                            <tr>
                                <th class="px-4 py-3">Date</th>
                                <th class="px-4 py-3">Resort</th>
                                <th class="px-4 py-3 text-right">Vert (ft)</th>
                                <th class="px-4 py-3 text-right">Speed (mph)</th>
                            </tr>
                        </thead>
                        <tbody id="log-table" class="divide-y divide-slate-700/50">
                            <!-- Log Rows Injected Here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script>
        // Your Google Apps Script API URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbzGsR7rsHCVbj16HS9Qi2OgK583MhXyRozzOBaZ24Bf0ujdo-xo_3ZdfMOpn5GRqELz3g/exec';
        
        let resortData = [];
        let logData = [];

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                resortData = data.resorts.filter(r => r.Resort); // Filter empty rows
                logData = data.logs.filter(l => l.Date);

                updateStats();
                renderResorts(resortData);
                renderLogs(logData);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loading').innerHTML = "<span class='text-red-400'>Failed to sync data. Check API URL.</span>";
            }
        }

        function updateStats() {
            const totalVert = logData.reduce((sum, log) => {
                const val = parseInt(String(log['Vertical Feet']).replace(/,/g, '')) || 0;
                return sum + val;
            }, 0);
            
            document.getElementById('total-vert').innerText = totalVert.toLocaleString() + ' ft';
            document.getElementById('total-days').innerText = logData.length;
        }

        function renderResorts(resorts) {
            const grid = document.getElementById('resort-grid');
            grid.innerHTML = '';

            resorts.forEach(resort => {
                // Handle Burn-down logic
                const daysUsed = parseInt(resort['Days Used']) || 0;
                const isMaxed = daysUsed >= 2;
                
                const card = document.createElement('div');
                card.className = `p-4 rounded-lg border ${isMaxed ? 'bg-slate-900 border-red-900/50 opacity-60' : 'bg-slate-800 border-slate-700'} flex justify-between items-center`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-white ${isMaxed ? 'line-through decoration-red-500' : ''}">${resort.Resort}</h3>
                            <span class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300">${resort.State}</span>
                        </div>
                        <div class="text-sm text-slate-400 mt-1 flex gap-3">
                            <span><i class="opacity-50">↓</i> ${resort['Vertical Drop']} ft</span>
                            <span><i class="opacity-50">🚗</i> ${resort['Drive Time']}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-500 mb-1">Indy Days</div>
                        <div class="flex gap-1">
                            <div class="w-3 h-3 rounded-full ${daysUsed >= 1 ? 'bg-blue-500' : 'bg-slate-600'}"></div>
                            <div class="w-3 h-3 rounded-full ${daysUsed >= 2 ? 'bg-blue-500' : 'bg-slate-600'}"></div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderLogs(logs) {
            const table = document.getElementById('log-table');
            table.innerHTML = '';
            
            // Sort logs newest first
            const sortedLogs = [...logs].sort((a, b) => new Date(b.Date) - new Date(a.Date));

            if (sortedLogs.length === 0) {
                table.innerHTML = '<tr><td colspan="4" class="px-4 py-6 text-center text-slate-500">No days logged yet. Hit the mountain!</td></tr>';
                return;
            }

            sortedLogs.forEach(log => {
                const date = new Date(log.Date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-750 transition-colors";
                row.innerHTML = `
                    <td class="px-4 py-3 text-slate-300">${date}</td>
                    <td class="px-4 py-3 font-medium text-white">${log.Resort}</td>
                    <td class="px-4 py-3 text-right text-blue-400 font-mono">${log['Vertical Feet']}</td>
                    <td class="px-4 py-3 text-right text-slate-400">${log['Top Speed']}</td>
                `;
                table.appendChild(row);
            });
        }

        function sortResorts(key) {
            const sorted = [...resortData].sort((a, b) => {
                // Strip commas and text to parse actual numbers for accurate sorting
                const valA = parseFloat(String(a[key]).replace(/[^0-9.]/g, '')) || 0;
                const valB = parseFloat(String(b[key]).replace(/[^0-9.]/g, '')) || 0;
                
                // For Vertical Drop, sort highest to lowest. For Drive Time, sort lowest to highest.
                return key === 'Vertical Drop' ? valB - valA : valA - valB;
            });
            
            // Push resorts with 2 days used to the bottom regardless of sort
            sorted.sort((a, b) => {
                const maxA = (parseInt(a['Days Used']) >= 2) ? 1 : 0;
                const maxB = (parseInt(b['Days Used']) >= 2) ? 1 : 0;
                return maxA - maxB;
            });

            renderResorts(sorted);
        }

        // Boot up
        fetchData();
    </script>
</body>
</html>
